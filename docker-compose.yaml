name: mentoai

services:
  backend:
    build:
      context: ../mentoai-api
      dockerfile: Dockerfile

    container_name: mentoai-api

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD}
      FEEDBACK_RECIPIENT_EMAIL: ${FEEDBACK_RECIPIENT_EMAIL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

    volumes:
      - ./wallet:/app/wallet:ro

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    # restart: unless-stopped


  frontend:
    build:
      context: ../mentoai-frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: mentoai-frontend

    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080}

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    depends_on:
      - backend

  #   restart: unless-stopped
